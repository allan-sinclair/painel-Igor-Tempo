<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Igor já volta — overlay vertical</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:Arial,Helvetica,sans-serif}
.stage{position:relative;width:100vw;height:100vh;min-height:100%;overflow:hidden;background:transparent;display:grid;place-items:center}
.glow{position:absolute;width:70vw;height:40vh;border-radius:50%;background:radial-gradient(ellipse,rgba(222,38,94,.13),rgba(70,8,30,.035) 55%,transparent 72%);filter:blur(25px);animation:pulse 5s ease-in-out infinite}
.card{position:relative;width:min(94vw,900px);padding:clamp(22px,4vw,46px) clamp(18px,4vw,42px);border-radius:30px;text-align:center;overflow:hidden;
background:linear-gradient(135deg,rgba(42,13,27,.76),rgba(80,18,43,.57),rgba(28,10,23,.76));
border:1px solid rgba(255,190,210,.65);
box-shadow:0 0 0 1px rgba(255,255,255,.07) inset,0 14px 45px rgba(20,0,8,.25),0 0 38px rgba(245,67,123,.17);
backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
animation:pop .85s cubic-bezier(.2,.8,.2,1) both}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(115deg,rgba(255,255,255,.7),transparent 28%,rgba(255,124,169,.65) 70%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card:after{content:"";position:absolute;inset:-80% -30%;background:linear-gradient(110deg,transparent 43%,rgba(255,255,255,.13) 49%,transparent 55%);transform:translateX(-65%);animation:shine 6s ease-in-out infinite;pointer-events:none}
.kicker{position:relative;z-index:2;margin-bottom:12px;color:#ffb7ce;font-size:clamp(11px,1.7vw,17px);font-weight:800;letter-spacing:.32em;text-transform:uppercase}
.main{position:relative;z-index:2;color:#fff8fb;font-size:clamp(20px,3.7vw,43px);font-weight:900;line-height:1.35;text-shadow:0 3px 12px rgba(0,0,0,.65),0 0 18px rgba(255,96,150,.26)}
.sub{position:relative;z-index:2;margin-top:14px;color:#ffe4ed;font-size:clamp(16px,2.5vw,28px);font-weight:800;letter-spacing:.03em;text-shadow:0 2px 8px rgba(0,0,0,.65)}
.rule{position:relative;z-index:2;width:clamp(75px,18vw,170px);height:2px;margin:18px auto 0;background:linear-gradient(90deg,transparent,#ff9fbd,transparent);box-shadow:0 0 12px rgba(255,120,165,.6)}
.berry{position:absolute;z-index:3;opacity:0;font-size:clamp(20px,3vw,34px);filter:drop-shadow(0 3px 7px rgba(0,0,0,.5));pointer-events:none}
.b1{top:9%;right:7%;animation:float 5s linear infinite}
.b2{bottom:8%;right:23%;animation:float 5.8s 1.1s linear infinite;font-size:clamp(17px,2.4vw,27px)}
.b3{top:13%;right:38%;animation:float 5.2s 2.2s linear infinite;font-size:clamp(18px,2.7vw,30px)}
.b4{bottom:7%;right:8%;animation:float 5.5s 2.8s linear infinite;font-size:clamp(16px,2.2vw,25px)}
.b5{top:16%;left:7%;animation:float 5.7s 1.8s linear infinite;font-size:clamp(17px,2.5vw,28px)}
.spark{position:absolute;color:#ffd6e3;opacity:0;animation:sparkle 3s ease-in-out infinite}
.s1{top:18%;left:13%}.s2{bottom:18%;right:13%;animation-delay:1s}.s3{top:12%;right:17%;animation-delay:1.7s}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shine{0%,35%{transform:translateX(-65%)}75%,100%{transform:translateX(65%)}}
@keyframes float{0%{opacity:0;transform:translate(24px,12px) scale(.6) rotate(-25deg)}15%{opacity:1}55%{opacity:1;transform:translate(-70px,-10px) scale(1.12) rotate(18deg)}100%{opacity:0;transform:translate(-155px,8px) scale(.75) rotate(48deg)}}
@keyframes pulse{0%,100%{transform:scale(.92);opacity:.6}50%{transform:scale(1.08);opacity:1}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.9;transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){*,*:before{animation:none!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span>
  <div class="card">
    <span class="berry b1">🍓</span><span class="berry b2">🍓</span><span class="berry b3">🍓</span><span class="berry b4">🍓</span><span class="berry b5">🍓</span>
    <div class="kicker">♡ mensagem da live ♡</div>
    <div class="main">𝐎 𝐢𝐠𝐨𝐫 𝐣𝐚 𝐯𝐨𝐥𝐭𝐚☛<br>𝐁𝐨𝐫𝐚 𝐧𝐨 𝐓𝐞𝐩 𝐓𝐞𝐩<br>𝐒𝐞𝐮𝐬 𝐥𝐢𝐧𝐝𝐨𝐬🍓</div>
    <div class="rule"></div>
    <div class="sub">sejam bem-vindos ♡</div>
  </div>
</div>
</body>
</html>
